name: CPU contract tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[train,data,encoders,verify,uncertainty]"
      - name: Run contract tests and synthetic architecture demo
        run: |
          python -m unittest discover -s tests
          python scripts/demo_sequence_architecture.py
